<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>PROXe — Inputs</title>
<link rel="stylesheet" href="_card.css" />
<style>
  .card { padding: 28px 32px; justify-content: center; gap: 18px; }
  .field { display: flex; flex-direction: column; gap: 6px; max-width: 480px; }
  .lab { font-family: var(--font-sans); font-size: 11px; color: rgba(255,255,255,0.78); letter-spacing: 0.10em; text-transform: uppercase; font-weight: 600; }
  .inp {
    padding: 12px 16px; border-radius: 12px; font-size: 14px;
    background: rgba(255, 255, 255, 0.10); color: #fff;
    border: 1px solid rgba(255, 255, 255, 0.22);
    font-family: var(--font-sans); outline: none;
  }
  .inp::placeholder { color: rgba(255,255,255,0.65); }
  .inp:focus { border-color: rgba(255,255,255,0.55); background: rgba(255,255,255,0.16); }

  /* White pill chat input — matches the hero CTA style. */
  .askbar {
    display: inline-flex; align-items: center; gap: 8px;
    padding: 6px 8px 6px 22px; border-radius: 999px;
    background: #FFFFFF; max-width: 480px; width: 100%;
    box-shadow: 0 8px 24px rgba(16, 4, 66, 0.35);
  }
  .askbar input { flex: 1; background: transparent; border: none; outline: none; color: #0A0A0A; font-size: 14px; font-family: var(--font-sans); }
  .askbar input::placeholder { color: rgba(0,0,0,0.50); }
  .askbar .knob { width: 30px; height: 30px; border-radius: 50%; background: #0A0A0A; color: #fff; border: none; cursor: pointer; font-size: 14px; }
</style>
</head>
<body>
  <div class="card">
    <div class="field">
      <span class="lab">Business name</span>
      <input class="inp" placeholder="Acme Co." />
    </div>
    <div class="field">
      <span class="lab">Hero ask bar (CTA pattern)</span>
      <div class="askbar">
        <input placeholder="What's PROXe?" />
        <button class="knob">→</button>
      </div>
    </div>
  </div>
</body>
</html>
