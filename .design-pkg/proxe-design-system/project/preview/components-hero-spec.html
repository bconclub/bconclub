<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>PROXe — Hero Spec</title>
<link rel="stylesheet" href="_card.css" />
<style>
  .card { padding: 56px 24px; align-items: center; justify-content: center; }
  .eye { font-family: var(--font-sans); font-size: 12px; font-weight: 600; letter-spacing: 0.16em; text-transform: uppercase; color: rgba(255,255,255,0.85); }
  .ti { font-family: var(--font-display); font-size: 76px; font-weight: 400; line-height: 1.05; letter-spacing: -0.02em; color: #fff; text-align: center; max-width: 13ch; margin: 14px auto 16px; }
  .sub { font-family: var(--font-sans); font-size: 14px; line-height: 1.55; color: rgba(255,255,255,0.85); text-align: center; max-width: 46ch; }
  .cta {
    margin-top: 28px;
    display: inline-flex; align-items: center; gap: 6px;
    padding: 6px 8px 6px 22px; border-radius: 999px;
    background: #FFFFFF; color: #0A0A0A;
    font-family: var(--font-sans); font-size: 14px; font-weight: 500;
    border: none; cursor: pointer;
    box-shadow: 0 8px 24px rgba(16, 4, 66, 0.35);
  }
  .cta__knob {
    width: 30px; height: 30px; border-radius: 50%;
    background: #0A0A0A; color: #fff; display: inline-flex; align-items: center; justify-content: center;
    font-size: 14px;
  }
</style>
</head>
<body>
  <div class="card">
    <p class="eye">AI&nbsp;&nbsp;CUSTOMER&nbsp;&nbsp;ACQUISITION</p>
    <h1 class="ti">Never Miss a Lead Ever Again.</h1>
    <p class="sub">PROXe runs the full pipeline. Captures leads across channels, nurtures, scores, and pushes the ready-to-buy ones to you.</p>
    <button class="cta">What's PROXe? <span class="cta__knob">→</span></button>
  </div>
</body>
</html>
