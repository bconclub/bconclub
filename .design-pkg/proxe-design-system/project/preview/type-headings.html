<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>PROXe — Heading Scale</title>
<link rel="stylesheet" href="_card.css" />
<style>
  .card { padding: 24px 32px; gap: 4px; }
  .meta { font-family: var(--font-mono); font-size: 10px; color: var(--fg-4); letter-spacing: 0.06em; }
  .line { display: flex; align-items: baseline; gap: 16px; padding: 4px 0; border-bottom: 1px dashed var(--border-faint); }
  .line:last-child { border-bottom: none; }
  .line .meta { width: 100px; flex-shrink: 0; }
</style>
</head>
<body>
  <div class="card">
    <div class="line"><span class="meta">H1 · 66 / 1.2</span><h1 class="ds-h1">Powerful Features</h1></div>
    <div class="line"><span class="meta">H2 · 45 / 1.2</span><h2 class="ds-h2">The complete AI system</h2></div>
    <div class="line"><span class="meta">H3 · 32 / 1.2</span><h3 class="ds-h3">One Memory, One Voice</h3></div>
    <div class="line"><span class="meta">H4 · 24 · Sans 600</span><h4 class="ds-h4">Self-Learning Core</h4></div>
    <div class="line"><span class="meta">EYEBROW · 12</span><span class="ds-eyebrow">Capture · Remember · Close</span></div>
  </div>
</body>
</html>
