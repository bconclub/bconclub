<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>PROXe — Neutrals</title>
<link rel="stylesheet" href="_card.css" />
<style>
  .card { padding: 28px 32px; }
  .grid { display: grid; grid-template-columns: repeat(5, 1fr); gap: 14px; }
</style>
</head>
<body>
  <div class="card">
    <div class="grid">
      <div class="swatch"><div class="swatch__chip" style="background:#0A0A0A;border-color:rgba(255,255,255,0.08)"></div><span class="swatch__name">bg-0 page</span><span class="swatch__hex">#0A0A0A</span></div>
      <div class="swatch"><div class="swatch__chip" style="background:#0F0D0F"></div><span class="swatch__name">bg-1 chat</span><span class="swatch__hex">#0F0D0F</span></div>
      <div class="swatch"><div class="swatch__chip" style="background:#13162C"></div><span class="swatch__name">bg-2 card mix</span><span class="swatch__hex">#13162C</span></div>
      <div class="swatch"><div class="swatch__chip" style="background:#1A1230"></div><span class="swatch__name">bg-3 elevated</span><span class="swatch__hex">#1A1230</span></div>
      <div class="swatch"><div class="swatch__chip" style="background:#FDFEFD"></div><span class="swatch__name">white</span><span class="swatch__hex">#FDFEFD</span></div>
    </div>
    <p style="font-family:var(--font-sans);font-size:12px;color:var(--fg-4);margin-top:10px">
      Backgrounds layer behind a fixed violet/blue radial bloom and an animated
      <code style="font-family:var(--font-mono);color:var(--fg-3)">DarkVeil</code>
      shader. Cards float as glass on top.
    </p>
  </div>
</body>
</html>
