<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>PROXe — Display Type</title>
<link rel="stylesheet" href="_card.css" />
<style>
  .card { padding: 28px 36px; gap: 8px; justify-content: center; }
  .meta { font-family: var(--font-mono); font-size: 11px; color: var(--fg-4); letter-spacing: 0.04em; }
  .row { display: flex; gap: 24px; align-items: baseline; flex-wrap: wrap; }
</style>
</head>
<body>
  <div class="card">
    <span class="meta">DISPLAY · INSTRUMENT SERIF · 400</span>
    <h1 class="ds-display" style="font-size:84px;line-height:1.05">Every Conversation</h1>
    <h1 class="ds-display" style="font-size:84px;line-height:1.05;font-style:italic;color:var(--fg-3)">Every Opportunity <em style="color:var(--proxe-violet-bright)">Owned.</em></h1>
    <span class="meta" style="margin-top:6px">Used for hero, slide titles, big quotes. Italic for emphasis.</span>
  </div>
</body>
</html>
