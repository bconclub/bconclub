<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>PROXe — Glass Anatomy</title>
<link rel="stylesheet" href="_card.css" />
<style>
  .card { padding: 28px 32px; gap: 18px; align-items: center; justify-content: center; }
  .demo {
    display: grid; grid-template-columns: 280px 1fr; gap: 22px; width: 100%; max-width: 700px; align-items: center;
  }
  .glass {
    aspect-ratio: 4/3;
    border-radius: 24px;
    background: rgba(255, 255, 255, 0.06);
    border: 1px solid rgba(255, 255, 255, 0.22);
    box-shadow: 0 18px 40px rgba(16, 4, 66, 0.40), inset 0 1px 0 rgba(255, 255, 255, 0.10);
    backdrop-filter: blur(28px) saturate(140%);
    -webkit-backdrop-filter: blur(28px) saturate(140%);
    display: flex; align-items: flex-end; padding: 18px;
    color: #fff; font-family: var(--font-display); font-size: 22px;
  }
  .recipe {
    font-family: var(--font-mono); font-size: 11px; line-height: 1.85; color: rgba(255,255,255,0.92);
    padding: 18px; border-radius: 14px;
    background: rgba(255,255,255,0.04); border: 1px solid rgba(255,255,255,0.18);
  }
  .recipe b { color: #fff; font-weight: 600; }
  .recipe span { color: rgba(255,255,255,0.65); }
</style>
</head>
<body>
  <div class="card">
    <div class="demo">
      <div class="glass">Glass card</div>
      <div class="recipe">
        <b>bg</b>      <span>rgba(255, 255, 255, 0.06)</span><br/>
        <b>border</b>  <span>1px solid rgba(255, 255, 255, 0.22)</span><br/>
        <b>radius</b>  <span>24px</span><br/>
        <b>blur</b>    <span>blur(28px) saturate(140%)</span><br/>
        <b>shadow</b>  <span>0 18px 40px rgba(16, 4, 66, 0.40)</span><br/>
        <b>highlight</b><span> inset 0 1px 0 rgba(255, 255, 255, 0.10)</span>
      </div>
    </div>
  </div>
</body>
</html>
