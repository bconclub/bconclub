<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>PROXe — Stat Card</title>
<link rel="stylesheet" href="_card.css" />
<style>
  .card { padding: 28px 32px; justify-content: center; }
  .grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 16px; }
  .sc {
    padding: 26px 22px; border-radius: 22px;
    background: rgba(255, 255, 255, 0.06);
    border: 1px solid rgba(255, 255, 255, 0.22);
    backdrop-filter: blur(28px) saturate(140%);
    box-shadow: 0 18px 40px rgba(16, 4, 66, 0.40), inset 0 1px 0 rgba(255, 255, 255, 0.10);
  }
  .v { font-family: var(--font-display); font-size: 48px; line-height: 1.05; color: #fff; margin: 0; letter-spacing: -0.02em; }
  .l { font-family: var(--font-sans); font-size: 13px; color: rgba(255,255,255,0.85); margin-top: 4px; }
</style>
</head>
<body>
  <div class="card">
    <div class="grid">
      <div class="sc"><p class="v">1M+</p><p class="l">Conversations at scale</p></div>
      <div class="sc"><p class="v">&lt; 2s</p><p class="l">Lightning-fast replies</p></div>
      <div class="sc"><p class="v">142%</p><p class="l">Qualified lead surge</p></div>
      <div class="sc"><p class="v">99.9%</p><p class="l">Always-on reliability</p></div>
    </div>
  </div>
</body>
</html>
