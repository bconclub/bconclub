<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>PROXe — Brand Palette</title>
<link rel="stylesheet" href="_card.css" />
<style>
  .card { padding: 28px 32px; gap: 18px; }
  .grid { display: grid; grid-template-columns: repeat(5, 1fr); gap: 14px; }
  .hero {
    height: 92px;
    border-radius: 18px;
    background:
      radial-gradient(ellipse 70% 70% at 92% 95%, rgba(16, 4, 66, 0.85), transparent 70%),
      #4B1FE5;
    box-shadow: 0 10px 30px rgba(16, 4, 66, 0.40), inset 0 1px 0 rgba(255,255,255,0.18);
    display: flex; align-items: flex-end; padding: 14px 18px;
    color: #fff; font-family: var(--font-display); font-size: 22px; letter-spacing: -0.01em;
    position: relative; overflow: hidden;
  }
  .hero::after { content: ""; position: absolute; inset: 0; background-image: var(--bg-grain-url); background-size: 256px 256px; opacity: 0.16; mix-blend-mode: overlay; }
  .hero small { font-family: var(--font-mono); font-size: 10px; opacity: 0.85; margin-left: auto; letter-spacing: 0.04em; position: relative; z-index: 1; }
  .hero span { position: relative; z-index: 1; }
</style>
</head>
<body>
  <div class="card">
    <div class="hero"><span>Electric Violet — the page</span><small>#4B1FE5 + grain + vignette</small></div>
    <div class="grid">
      <div class="swatch"><div class="swatch__chip" style="background:#4B1FE5"></div><span class="swatch__name">Violet — Primary</span><span class="swatch__hex">#4B1FE5</span></div>
      <div class="swatch"><div class="swatch__chip" style="background:#6B47F0"></div><span class="swatch__name">Violet — Bright</span><span class="swatch__hex">#6B47F0</span></div>
      <div class="swatch"><div class="swatch__chip" style="background:#2A0EAF"></div><span class="swatch__name">Violet — Deep</span><span class="swatch__hex">#2A0EAF</span></div>
      <div class="swatch"><div class="swatch__chip" style="background:#100442"></div><span class="swatch__name">Violet — Darkest</span><span class="swatch__hex">#100442</span></div>
      <div class="swatch"><div class="swatch__chip" style="background:#FFFFFF;border:1px solid rgba(0,0,0,0.08)"></div><span class="swatch__name">White</span><span class="swatch__hex">#FFFFFF</span></div>
    </div>
  </div>
</body>
</html>
