<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>PROXe — AI Customer Acquisition System</title>
<link rel="icon" href="../../assets/logo/PROXe-Favicon.png" />
<link rel="stylesheet" href="site.css?v=5" />
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
</head>
<body>
<div id="root"></div>

<script type="text/babel" src="Header.jsx"></script>
<script type="text/babel" src="Hero.jsx"></script>
<script type="text/babel" src="Channels.jsx"></script>
<script type="text/babel" src="Features.jsx"></script>
<script type="text/babel" src="Stats.jsx"></script>
<script type="text/babel" src="Footer.jsx"></script>
<script type="text/babel" src="ChatWidget.jsx"></script>

<script type="text/babel">
  const App = () => {
    const [piped, setPiped] = React.useState({ q: "", k: 0 });
    const ask = (q) => setPiped({ q, k: Date.now() });

    return (
      <>
        <ProxeHeader onDeploy={() => ask("Deploy PROXe")} />
        <main>
          <ProxeHero onAsk={ask} />
          <ProxeChannels />
          <ProxeFeatures />
          <ProxeStats />
        </main>
        <ProxeFooter onDeploy={() => ask("Deploy PROXe")} />
        <ProxeChatWidget external={piped} />
      </>
    );
  };

  ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
</body>
</html>
